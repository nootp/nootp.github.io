<!DOCTYPE html>

<html lang="en">
    <head>
        <link rel="icon" type="image/jpeg" href="pictures/cbbc.jpg">
        <script type="text/javascript">

  document.addEventListener('DOMContentLoaded', function () {
    var vx = 5;
    var vy = 3;

    var chiito = document.getElementById('bounce');

    function setVelocityToRandom() {
        // absolutely arbitrary numbers
        var velocity = 5 + Math.random() * 2;
        var angleDiff = (Math.random() - 0.5) * 0.75;
        var oldAngle = Math.atan2(vy, vx);
        var newAngle = oldAngle + angleDiff;
        console.log(oldAngle,newAngle)
        vx = velocity * Math.cos(newAngle);
        vy = velocity * Math.sin(newAngle);
    }

    var counter = 0;

    var x = 0;
    var y = 0;

    function step() {
        window.requestAnimationFrame(step);

        if(counter < 100) {
            counter++;
            return;
        }

        x += vx;
        chiito.style.left = x + "px";

        y += vy;
        chiito.style.top = y + "px";

        if((x < 0) || (x + chiito.width > window.innerWidth)) { vx *= -1; x += 3 * vx; setVelocityToRandom(); }
        if((y < 0) || (y + chiito.height > window.innerHeight)) { vy *= -1; y += 3 * vy; setVelocityToRandom(); }
    }

    step();
  });

        </script>
        <title>nootp website</title>
    </head>
    <body style="background-image: url(pictures/Yuri.jpg); background-size: 200px 220px;">
